<!doctype html>
<!-- Bundle dist/index.js to .canonical-interactions.library.bundle.js before direct execution. -->
<html>
<body>
  <iframe id="receiver" srcdoc="&lt;!doctype html&gt;&lt;html&gt;&lt;head&gt;&lt;/head&gt;&lt;body&gt;&lt;main&gt;&lt;button id='subject'&gt;subject&lt;/button&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
  <output id="result">running</output>
  <script type="module">
    import {
      Hson,
      activate_interactions,
      add_interaction,
      assertCanonicalClosure,
      bind_locus_http,
      continue_hosted_document,
      decode_hosted_root,
      enable_interactions,
      hsonLiveMap,
      hsonTransform,
      graft,
      admit_exact_runtime_livemap_libraries,
    } from "./.canonical-interactions.library.bundle.js";

    const QUID = "000008398";
    const PageSchema = Hson.schema`<type "document" tag "html" content <sequence [<tag "head" content "empty">, <tag "body" content <sequence [<tag "main" content <sequence [<tag "button" content "empty">]>>]>>]>>`;
    const StateSchema = Hson.schema`<type "data" content <count "number">>`;
    const page = hsonLiveMap.fromLibraries({ page: { document: "<main <button/>/>", schema: PageSchema } }).doc.must("page").root();
    page.$_content[0].$_content[0].$_content[1].$_content[0].$_content[0].$_content[0].$_content[0].$_meta = { quid: QUID };
    const map = admit_exact_runtime_livemap_libraries({
      state: { json: { count: 0 }, schema: StateSchema },
      page: { document: page, schema: PageSchema },
    });
    enable_interactions(map);
    const listener = (event, target, overrides = {}) => ({
      event, target, capture: true, once: false, passive: false, missingTarget: "throw",
      preventDefault: false, stopPropagation: false, stopImmediatePropagation: false,
      ...overrides,
    });
    const local = (id, key, event, target, overrides = {}) => ({
      id, subject: Object.freeze({ library: "page", path: [0, 0, 1, 0, 0, 0, 0] }), listener: listener(event, target, overrides),
      kind: "browser", key, args: Hson.data.from(-0),
    });
    add_interaction(map, local("element", "element", "click", "element", {
      once: true, preventDefault: true, stopPropagation: true, stopImmediatePropagation: true,
    }));
    add_interaction(map, local("document", "document", "hson-document", "document"));
    add_interaction(map, local("window", "window", "hson-window", "window"));
    add_interaction(map, local("passive", "passive", "hson-passive", "element", {
      passive: true, preventDefault: true,
    }));

    const frame = document.querySelector("#receiver");
    if (frame.contentDocument.readyState !== "complete") await new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
    const subjectDocument = frame.contentDocument, subjectWindow = frame.contentWindow;
    const tree = graft(subjectDocument.documentElement, { unsafe: false });
    const treeButtonQuid = tree.find.must.byId("subject").quid;
    const calls = { element: 0, document: 0, window: 0, passive: 0 };
    let exactArgs = false;
    const dispose = activate_interactions({
      map,
      tree,
      local: {
        element: (_event, subject, args) => {
          calls.element += 1;
          exactArgs = subject.node.$_meta?.quid === treeButtonQuid
            && treeButtonQuid !== QUID && Object.is(args.materialize(), -0);
        },
        document: () => { calls.document += 1; },
        window: () => { calls.window += 1; },
        passive: () => { calls.passive += 1; },
      },
    });

    const button = subjectDocument.querySelector("#subject");
    let afterImmediateStop = 0;
    button.addEventListener("click", () => { afterImmediateStop += 1; });
    const click = new Event("click", { bubbles: true, cancelable: true });
    button.dispatchEvent(click);
    button.dispatchEvent(new Event("click", { bubbles: true, cancelable: true }));
    subjectDocument.dispatchEvent(new subjectWindow.Event("hson-document"));
    subjectWindow.dispatchEvent(new subjectWindow.Event("hson-window"));
    const passive = new Event("hson-passive", { cancelable: true });
    button.dispatchEvent(passive);

    const runtimeMap = hsonLiveMap.create();
    const runtimeCommit = runtimeMap.addLibraries({ runtimePage: { document: Hson.document`<main "browser"/>` },
      runtimeData: { json: true } });
    const runtimeReplica = hsonLiveMap.create();
    runtimeReplica.replay(runtimeCommit.commit);
    const runtimeAdmissionPassed = runtimeMap.rev === 1
      && runtimeMap.doc.must("runtimePage").render() === "<!doctype html><html><head></head><body><main>browser</main><\/body></html>"
      && runtimeReplica.capture().registry.digest === runtimeMap.capture().registry.digest;

    const passed = runtimeAdmissionPassed && calls.element === 1
      && calls.document === 1
      && calls.window === 1
      && calls.passive === 1
      && click.defaultPrevented
      && !passive.defaultPrevented
      && afterImmediateStop === 1
      && exactArgs;
    dispose();
    dispose();
    const result = document.querySelector("#result");
    try {
      await checkAuthoredEvents();
      window.__HSON_CANONICAL_INTERACTIONS_BROWSER__ = Object.freeze({ passed, calls, exactArgs });
      result.textContent = passed ? "pass" : `fail ${JSON.stringify(window.__HSON_CANONICAL_INTERACTIONS_BROWSER__)}`;
      result.dataset.status = passed ? "pass" : "fail";
    } catch (cause) {
      result.textContent = cause.stack ?? String(cause);
      result.dataset.status = "fail";
    }

    async function checkAuthoredEvents() {
      const payloads = [], args = [], failures = [];
      const check = (condition, message) => { if (!condition) throw new Error(message); };
      const parsed = hsonTransform.fromHson('<button id="observed" event:advance/>');
      const graph = parsed.toNode(), attrs = graph.$_content[0].$_attrs;
      delete attrs["event:advance"];
      attrs["event:advance"] = "ready";
      check(hsonTransform.fromNode(graph).toHson().serialize().includes('event:advance="ready"'), "Valued reassignment was lost.");
      attrs["event:advance"] = "event:advance";
      const observed = hsonTransform.fromNode(graph).toHson().serialize();
      const oracle = { launcher: "native-chrome", caseId: "public oracle" };
      const { semantic, reparsed, serialized } = assertCanonicalClosure({ ...oracle, ingress: "hson-source",
        source: '<button id="advance" event:advance "Next"/>' });
      const oracleAttrs = reparsed.$_content[0].$_attrs;
      delete oracleAttrs["event:advance"];
      oracleAttrs["event:advance"] = "event:advance";
      oracleAttrs.id = "oracle-observed";
      const oracleObserved = assertCanonicalClosure({ ...oracle, ingress: "canonical-node", node: reparsed }).serialized;
      const transplanted = hsonTransform.fromHson("<button/>").toNode();
      transplanted.$_content[0].$_attrs = semantic.$_content[0].$_attrs;
      transplanted.$_content[0].$_attrs.id = "oracle-transplanted";
      const oracleTransplanted = assertCanonicalClosure({ ...oracle, ingress: "canonical-node", node: transplanted }).serialized;
      const locus = hsonLiveMap.locus.create({
        parts: { access: "private", parts: {
          controls: {
            kind: "document",
            document: Hson.document`<main hson:part
              ${serialized}
              <button id="panel" event:panel "Panel"/>
              <button id="ordinary" event:advance="event:advance" event:phase="ready" "Ordinary"/>
              ${observed}
              ${Hson.document`<section ${oracleObserved} ${oracleTransplanted}/>`}
            />`,
            events: {
              advance: "<hson:event once stopProp on:click host:deck.advance input:data={<step 3>} <> >",
              panel: "<hson:event on:click local:deck.panel input:data={-0} <> >",
            },
          },
          extra: {
            kind: "document",
            document: Hson.document`<button hson:part id="extra" event:panel "Extra"/>`,
            events: { panel: "<hson:event on:click local:deck.panel input:data={null} <> >" },
          },
        } },
        page: { access: "shared", document: '<hson-part lib="parts" at="controls"/>' },
      }, {
        authorizeProjection: ({ requested }) => requested,
        actions: { "deck.advance": (_context, payload) => { payloads.push(payload); } },
      });
      const binding = bind_locus_http(locus, { endpoint: "/authored-events" });
      const transport = hsonLiveMap.echo.transport.http({ endpoint: "http://authored.test/authored-events",
        fetch: (input, init) => binding.handle(new Request(input, init), {}) });
      const receiver = document.createElement("iframe");
      let continuation, submissions = 0;
      const until = async (condition, message) => {
        for (let attempt = 0; attempt < 150 && !condition(); attempt++) await new Promise(resolve => setTimeout(resolve, 5));
        check(condition(), message);
      };
      try {
        const session = await locus.session.create({ libraries: ["page"], systemFeatures: ["interactions"] });
        const now = session.now({ html: "page" });
        const state = decode_hosted_root(now.libs.system.interactions).$_content[0];
        const descriptorCount = JSON.parse(hsonTransform.fromNode(state).toJson().serialize()).descriptors.length;
        check(!/event:panel|hson:event|hson-part|input:data/.test(JSON.stringify(now)), "Authored markers leaked into hosted output.");
        const loaded = new Promise(resolve => receiver.addEventListener("load", resolve, { once: true }));
        receiver.srcdoc = now.html;
        document.body.append(receiver);
        await loaded;
        const page = receiver.contentDocument;
        continuation = await continue_hosted_document({
          now, credential: session.credential, root: page.documentElement,
          transport: { ...transport, operations: { submit(request, options) {
            if (request.type === "action") submissions++;
            return transport.operations.submit(request, options);
          } } },
          interactions: { local: { "deck.panel": (_event, subject, data) => { args.push([subject.dom.el(), data]); } },
            onFailure: failure => failures.push(failure) },
        });
        const advance = page.querySelector("#advance"), panel = page.querySelector("#panel");
        let bubbles = 0;
        page.querySelector("main").addEventListener("click", () => bubbles++);
        panel.click();
        check(args.length === 1 && args[0][0] === panel && Object.is(args[0][1].scalar(), -0) && submissions === 0,
          "Browser-local behavior did not receive its subject and signed zero independently.");
        advance.click();
        advance.click();
        await until(() => payloads.length === 1 || failures.length > 0, "No authored Locus action was received.");
        check(payloads.length === 1 && payloads[0].equals(Hson.data.from({ step: 3 })) && submissions === 1
          && bubbles === 2 && failures.length === 0, "Authored Locus input or native once/stopProp behavior was incorrect.");
        await locus.stage(stage => stage.doc.must("page").at([1, 0]).asElement().move(0, 1));
        await until(() => continuation.echo.sync.appliedRev === locus.rev, "Authored occurrence move did not reach the browser.");
        check(page.querySelector("main").firstElementChild === panel, "Movement replaced the browser's subject.");
        panel.click();
        advance.click();
        check(args.length === 2 && args[1][0] === panel && submissions === 1, "Movement changed a listener lifetime.");
        const extra = hsonTransform.fromHson(locus.parts.parts.extra.write()).toNode().$_content[0];
        await locus.stage(stage => stage.doc.must("page").at([1, 0]).asElement().insert(2, extra));
        await until(() => continuation.echo.sync.appliedRev === locus.rev, "Authored insertion did not reach the browser.");
        const inserted = page.querySelector("#extra");
        check(inserted && !inserted.hasAttribute("event:panel"), "Inserted subject was missing or leaked authoring syntax.");
        inserted.click();
        const ordinary = page.querySelector("#ordinary");
        check(!advance.hasAttribute("event:advance") && ordinary.getAttribute("event:advance") === "event:advance"
          && ordinary.getAttribute("event:phase") === "ready", "Valued attributes did not survive native realization.");
        ordinary.click();
        check(args.length === 3 && args[2][0] === inserted && args[2][1].scalar() === null && submissions === 1,
          "Hosted insertion did not activate the authored browser-local descriptor.");
        const observedButton = page.querySelector("#observed");
        observedButton.click();
        const oracleButton = page.querySelector("#oracle-observed");
        const transplantedButton = page.querySelector("#oracle-transplanted");
        oracleButton.click();
        transplantedButton.click();
        if (submissions > 1) await until(() => payloads.length > 1 || failures.length > 0, "Extra action did not settle.");
        check(descriptorCount === 2 && submissions === 1 && payloads.length === 1
          && observedButton.getAttribute("event:advance") === "event:advance"
          && oracleButton.getAttribute("event:advance") === "event:advance"
          && transplantedButton.getAttribute("event:advance") === "event:advance"
          && observed === '<button event:advance="event:advance" id="observed"/>',
        `Mutable flag round trip changed executable intent: ${JSON.stringify({ observed, oracleObserved, oracleTransplanted, descriptorCount, submissions, hostedActions: payloads.length })}`);
      } finally {
        continuation?.dispose();
        continuation?.echo.dispose();
        transport.dispose();
        binding.dispose();
        locus.dispose();
        receiver.remove();
      }
    }
  </script>
</body>
</html>
