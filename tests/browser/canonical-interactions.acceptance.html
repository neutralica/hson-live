        const coordinate = element.listen.onClick(() => { coordinateCalls++; });
        button.click(); button.click();
        check(directCalls === 2 && ambientCalls === 1 && coordinateCalls === 2 && payloads.length === 0 && locus.rev === authorityRevision
          && JSON.stringify(receiver.capture()) === JSON.stringify(earlier), "Hosted native callbacks crossed the authority boundary.");
        check(!(await actions.trigger("projectedCallback")).ok, "Native attachment registered a named action.");
        native.off();
        const input = Hson.data.fromSource(Hson.canonical`<step -0>`);
        const pending = locus.doc.must("page").q("advance").listen.host.onClick("deck.advance", input);
        check(pending instanceof Promise && typeof await pending === "string" && payloads.length === 0,
          "Locus listener authoring did not report asynchronous acceptance without dispatch.");
        await until(() => continued.echo.sync.appliedRev === locus.rev, "Echo did not apply the accepted Descriptor.");
        button.click();
        await until(() => payloads.length !== 0 || failures.length !== 0, "The native click did not dispatch through Echo.");
        check(payloads.length === 1 && payloads[0].equals(input) && failures.length === 0 && directCalls === 2 && coordinateCalls === 3,
          "The authorized Locus action did not receive the exact authored input.");
        let libraryNative = 0;
        projected.listen.onKeyDown(() => { libraryNative++; });
        frame.contentDocument.dispatchEvent(new frame.contentWindow.KeyboardEvent("keydown", { key: "Enter" }));
        await until(() => payloads.length === 2 || failures.length > 0, "Document-owned hosted Event did not dispatch.");
        check(payloads[1].materialize().pressed === "Enter" && libraryNative === 1 && failures.length === 0,
          "Document-owned hosted arguments or projected native listener failed.");
        const authorityIntent = JSON.stringify(session.now().libs.system);
        await session.update({ libraries: [], systemFeatures: [] });
        await until(() => continued.mirror.status === "failed", "Library projection revocation did not retire its realization.");
        frame.contentDocument.dispatchEvent(new frame.contentWindow.KeyboardEvent("keydown", { key: "revoked" }));
        check(libraryNative === 1 && payloads.length === 2, "Projection revocation retained Library native registrations.");
        const inspection = await locus.session.create({ libraries: ["page"], systemFeatures: ["interactions"] });
        check(JSON.stringify(inspection.now().libs.system) === authorityIntent, "Projection revocation deleted authority Event intent.");
        const latest = receiver.capture();
        check(latest.revision > earlier.revision, "The authoritative Descriptor did not reach the composed map.");
        continued.echo.session.dispose();
        let restoreError;
        try { receiver.restore(earlier); } catch (error) { restoreError = error; }
        check(/Echo authority/.test(restoreError?.message) && JSON.stringify(receiver.capture()) === JSON.stringify(latest),
          "A retained behavior map restored shared state after session disposal.");
        continued.dispose();
        button.click();
        check(coordinateCalls === 3, "Hosted continuation disposal left a native callback installed.");
        coordinate.off();
      } finally {
        continued?.dispose(); continued?.echo.dispose(); transport.dispose(); binding.dispose(); locus.dispose(); frame.remove();
      }
    }

    async function checkAuthoredEvents() {
      const payloads = [], args = [], failures = [];
      const check = (condition, message) => { if (!condition) throw new Error(message); };
      const parsed = hsonTransform.fromHson('<button id="observed" event:advance/>');
      const graph = parsed.toNode(), attrs = graph.$_content[0].$_attrs;
      delete attrs["event:advance"];
      attrs["event:advance"] = "ready";
      check(hsonTransform.fromNode(graph).toHson().serialize().includes('event:advance="ready"'), "Valued reassignment was lost.");
      attrs["event:advance"] = "event:advance";
      const observed = hsonTransform.fromNode(graph).toHson().serialize();
      const oracle = { launcher: "native-chrome", caseId: "public oracle" };
      const { semantic, reparsed, serialized } = assertCanonicalClosure({ ...oracle, ingress: "hson-source",
        source: '<button id="advance" event:advance "Next"/>' });
      const oracleAttrs = reparsed.$_content[0].$_attrs;
      delete oracleAttrs["event:advance"];
      oracleAttrs["event:advance"] = "event:advance";
      oracleAttrs.id = "oracle-observed";
      const oracleObserved = assertCanonicalClosure({ ...oracle, ingress: "canonical-node", node: reparsed }).serialized;
      const transplanted = hsonTransform.fromHson("<button/>").toNode();
      transplanted.$_content[0].$_attrs = semantic.$_content[0].$_attrs;
      transplanted.$_content[0].$_attrs.id = "oracle-transplanted";
      const oracleTransplanted = assertCanonicalClosure({ ...oracle, ingress: "canonical-node", node: transplanted }).serialized;
      const additions = {
        page: { access: "shared", document: '<hson-part lib="parts" at="controls"/>' },
        parts: { access: "private", parts: {
          controls: {
            kind: "document",
            document: Hson.document`<main hson:part
              ${serialized}
              <button id="panel" event:panel "Panel"/>
              <button id="reset" event:reset "Reset"/>
              <button id="ordinary" event:advance="event:advance" event:phase="ready" "Ordinary"/>
              ${observed}
              ${Hson.document`<section ${oracleObserved} ${oracleTransplanted}/>`}
            />`,
            events: {
              advance: "<hson:event once stopProp on:click host:deck.advance step:num=\"3\" offset:num=\"-0\" title:str=\"Next\" settings:data={<'10' -0 '2' null>} <> >",
              panel: "<hson:event on:click local:deck.panel offset:num=\"-0\" <> >",
              reset: "<hson:event on:click host:deck.reset <> >",
            },
          },
          extra: {
            kind: "document",
            document: Hson.document`<button hson:part id="extra" event:panel "Extra"/>`,
            events: { panel: "<hson:event on:click local:deck.panel offset:data={null} <> >" },
          },
        } },
      };
      const locus = hsonLiveMap.locus.create({ anchor: { access: "shared", document: "<aside/>" } }, {
        authorizeProjection: ({ requested }) => requested,
        authorizeAction: ({ action }) => action === "deck.advance" || action === "deck.reset",
        actions: {
          "deck.advance": {
            args: { required: true, schema: Hson.schema`<type "data" content <step "number" offset "number" title "string" settings "any">>` },
            handler: (_context, payload) => { payloads.push(payload); },
          },
          "deck.reset": { args: { schema: ANY_DATA }, handler: (_context, payload) => { payloads.push(payload); } },
        },
      });
      const binding = bind_locus_http(locus, { endpoint: "/authored-events" });
      const transport = hsonLiveMap.echo.transport.http({ endpoint: "http://authored.test/authored-events",
        fetch: (input, init) => binding.handle(new Request(input, init), {}) });
      const receiver = document.createElement("iframe");
      let continuation, anchorEcho, stopRestore, submissions = 0;
      const until = async (condition, message) => {
        for (let attempt = 0; attempt < 150 && !condition(); attempt++) await new Promise(resolve => setTimeout(resolve, 5));
        check(condition(), message);
      };
      try {
        const anchor = await locus.session.create({ libraries: ["anchor"] });
        anchorEcho = await hsonLiveMap.echo.create({ now: anchor.now(), credential: anchor.credential, transport });
        const clientMap = echo_map_internal(anchorEcho), aggregate = internal_livemap_aggregate_authority(clientMap);
        const system = aggregate.systemState(INTERACTION_RESERVED_LIBRARY_KEY);
        const count = () => JSON.parse(hsonTransform.fromNode(aggregate.systemRoot(system).$_content[0]).toJson().serialize()).descriptors.length;
        const reconciled = [];
        stopRestore = aggregate.observeRestore(() => { reconciled.push([clientMap.doc.must("page").mode, count()]); });
        check(anchor.now().libs.system === null && count() === 0,
          "A featureless Echo must own an empty local store without authority interactions.");
        await locus.admit(additions);
        await until(() => anchorEcho.sync.appliedRev === locus.rev, "Hidden topology did not advance the existing session.");
        check(count() === 0 && reconciled.length === 0, "The anchor session received interactions before authorization.");
        await anchor.update({ libraries: ["anchor", "page"], systemFeatures: ["interactions"] });
        await until(() => reconciled.length !== 0, "The active Echo did not reconcile the admitted Document.");
        check(JSON.stringify(reconciled) === '[["document",3]]', "The first Document publication lacked its complete interaction state.");
        const session = await locus.session.create({ libraries: ["page"], systemFeatures: ["interactions"] });
        const now = session.now({ html: "page" });
        const state = decode_hosted_root(now.libs.system.interactions).$_content[0];
        const descriptorCount = JSON.parse(hsonTransform.fromNode(state).toJson().serialize()).descriptors.length;
        check(!/event:panel|hson:event|hson-part|input:data/.test(JSON.stringify(now)), "Authored markers leaked into hosted output.");
        const loaded = new Promise(resolve => receiver.addEventListener("load", resolve, { once: true }));
        receiver.srcdoc = now.html;
        document.body.append(receiver);
        await loaded;
        const page = receiver.contentDocument;
        continuation = await continue_hosted_document({
          now, credential: session.credential, root: page.documentElement,
          transport: { ...transport, operations: { submit(request, options) {
            if (request.type === "action") submissions++;
            return transport.operations.submit(request, options);
          } } },
          interactions: { registerActions(actions) {
            actions.define("deck.panel", (ctx, data) => { args.push([ctx.subject?.dom.el(), data]); },
              { args: { required: true, schema: ANY_DATA } });
          },
            onFailure: failure => failures.push(failure) },
        });
        const advance = page.querySelector("#advance"), panel = page.querySelector("#panel");
        let bubbles = 0;
        page.querySelector("main").addEventListener("click", () => bubbles++);
        panel.click();
        check(args.length === 1 && args[0][0] === panel && Object.is(args[0][1].entries()[0][1].scalar(), -0) && submissions === 0,
          "Browser-local behavior did not receive its subject and signed zero independently.");
        advance.click();
        advance.click();
        await until(() => payloads.length === 1 || failures.length > 0, "No authored Locus action was received.");
        check(payloads.length === 1 && payloads[0].equals(Hson.data.fromSource('{"step":3,"offset":-0,"title":"Next","settings":{"10":-0,"2":null}}')) && submissions === 1
          && bubbles === 2 && failures.length === 0, "Authored Locus input or native once/stopProp behavior was incorrect.");
        await locus.stage(stage => stage.doc.must("page").at([1, 0]).asElement().move(0, 1));
        await until(() => continuation.echo.sync.appliedRev === locus.rev, "Authored occurrence move did not reach the browser.");
        check(page.querySelector("main").firstElementChild === panel, "Movement replaced the browser's subject.");
        panel.click();
        advance.click();
        check(args.length === 2 && args[1][0] === panel && submissions === 1, "Movement changed a listener lifetime.");
        const extra = hsonTransform.fromHson(locus.parts.parts.extra.write()).toNode().$_content[0];
        await locus.stage(stage => stage.doc.must("page").at([1, 0]).asElement().insert(2, extra));
        await until(() => continuation.echo.sync.appliedRev === locus.rev, "Authored insertion did not reach the browser.");
        const inserted = page.querySelector("#extra");
        check(inserted && !inserted.hasAttribute("event:panel"), "Inserted subject was missing or leaked authoring syntax.");
        inserted.click();
        const ordinary = page.querySelector("#ordinary");
        check(!advance.hasAttribute("event:advance") && ordinary.getAttribute("event:advance") === "event:advance"
          && ordinary.getAttribute("event:phase") === "ready", "Valued attributes did not survive native realization.");
        ordinary.click();
        check(args.length === 3 && args[2][0] === inserted && args[2][1].entries()[0][1].scalar() === null && submissions === 1,
          "Hosted insertion did not activate the authored browser-local descriptor.");
        const observedButton = page.querySelector("#observed");
        observedButton.click();
        const oracleButton = page.querySelector("#oracle-observed");
        const transplantedButton = page.querySelector("#oracle-transplanted");
        oracleButton.click();
        transplantedButton.click();
        if (submissions > 1) await until(() => payloads.length > 1 || failures.length > 0, "Extra action did not settle.");
        check(descriptorCount === 3 && submissions === 1 && payloads.length === 1
          && observedButton.getAttribute("event:advance") === "event:advance"
          && oracleButton.getAttribute("event:advance") === "event:advance"
          && transplantedButton.getAttribute("event:advance") === "event:advance"
          && observed === '<button event:advance="event:advance" id="observed"/>',
        `Mutable flag round trip changed executable intent: ${JSON.stringify({ observed, oracleObserved, oracleTransplanted, descriptorCount, submissions, hostedActions: payloads.length })}`);
        page.querySelector("#reset").click();
        await until(() => payloads.length === 2 || failures.length > 0, "The input-free hosted action did not settle.");
        check(payloads.length === 2 && payloads[1] === undefined && submissions === 2 && failures.length === 0,
          "Hosted continuation did not preserve omitted input.");
      } finally {
        stopRestore?.();
        anchorEcho?.dispose();
        continuation?.dispose();
        continuation?.echo.dispose();
        transport.dispose();
        binding.dispose();
        locus.dispose();
        receiver.remove();
      }
    }
  </script>
