<!doctype html>
<html>
<head><meta charset="utf-8"><title>Document SSR acceptance</title></head>
<body>
<section id="local-shell"><!--LOCAL_SSR--></section>
<section id="local-libraries-shell"><!--LOCAL_LIBRARIES_SSR--></section>
<section id="libraries-shell"><!--LIBRARIES_SSR--></section>
<div id="result"></div>
<script type="module">
import {
  continue_document,
  continue_hosted_document,
  create_echo,
  create_browser_locus_socket,
  decode_ssr_bootstrap,
  encode_ssr_bootstrap,
  hson,
  install_libraries_snapshot,
  render_document,
} from "/bundle.js";

const results = [];
const check = (name, condition) => {
  results.push({ name, pass: Boolean(condition) });
  if (!condition) throw new Error(`Failed: ${name}`);
};

try {
  const state = await fetch("/__state").then((response) => response.json());
  const decodedLocalBootstrap = decode_ssr_bootstrap(state.encoded.local);
  check("browser local encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedLocalBootstrap.bootstrap) === state.encoded.local);
  const localRoot = document.querySelector("#local-ssr");
  check("application root is delivered in standards mode", document.compatMode === "CSS1Compat");
  const localParagraph = localRoot.firstElementChild;
  const localText = localParagraph.firstChild;
  const localMap = install_libraries_snapshot(decodedLocalBootstrap.bootstrap).map;
  const localPage = localMap.lib(state.local.document);
  const observer = new MutationObserver(() => {});
  observer.observe(localRoot, { subtree: true, childList: true, attributes: true, characterData: true });
  const localContinuation = continue_document({ map: localMap, document: localPage, root: localRoot });
  check("local root identity survives continuation", localContinuation.tree.dom.el() === localRoot);
  check("local element identity survives continuation", localRoot.firstElementChild === localParagraph);
  check("local text identity survives continuation", localParagraph.firstChild === localText);
  check("local continuation writes nothing", observer.takeRecords().length === 0);
  check("local revision is exact N", localMap.rev === state.local.bootstrap.revision && localMap.rev === 1);
  check("local canonical capture has no server QUID", JSON.stringify(localMap.capture()) === JSON.stringify(state.local.bootstrap)
    && !JSON.stringify(localMap.capture()).includes("000005201"));
  check("local subject begins without inherited QUID", localParagraph.getAttribute("hson:quid") === null
    && !JSON.stringify(decodedLocalBootstrap.bootstrap).includes("000005201"));
  check("local root remains QUID-free", localRoot.getAttribute("hson:quid") === null);
  check("local paragraph text was parsed", localParagraph.textContent === "ab");
  observer.disconnect();
  const localParagraphTree = localContinuation.tree.find.must.byTag("p");
  const localQuid = localParagraphTree.quid;
  check("browser identity demand establishes local QUID", typeof localQuid === "string" && localParagraph.getAttribute("hson:quid") === localQuid);
  check("local QUID lookup resolves adopted subject", localContinuation.tree.find.byQuid(localQuid)?.dom.el() === localParagraph);
  localParagraphTree.css.set.color("red");
  const localCss = localParagraphTree.css.snapshot();
  check("local CSS ownership uses browser QUID", localCss.includes(localQuid)
    && /color:\s*red/.test(localCss)
    && !localCss.includes("000005201"));
  localContinuation.dispose();

  const browserLocal = render_document({ map: localMap });
  check("Node and browser-compatible local SSR bytes match", browserLocal.html === state.local.html);
  check("browser local rendering matches its continuation", JSON.stringify(browserLocal.bootstrap) === JSON.stringify(localMap.capture()));

  const localLibrariesRoot = document.querySelector("#local-libraries-ssr");
  const localLibrariesButton = localLibrariesRoot.firstElementChild;
  const decodedLocalLibraries = decode_ssr_bootstrap(state.encoded.localLibraries);
  check("browser Libraries encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedLocalLibraries.bootstrap) === state.encoded.localLibraries);
  const localLibrariesInstalled = install_libraries_snapshot(decodedLocalLibraries.bootstrap);
  const browserLibrariesRender = render_document({ map: localLibrariesInstalled.map });
  check("browser Libraries rendering retains the complete continuation", browserLibrariesRender.document === "page"
    && browserLibrariesRender.html === state.localLibraries.html
    && JSON.stringify(browserLibrariesRender.bootstrap) === JSON.stringify(decodedLocalLibraries.bootstrap));
  const localLibrariesSelected = localLibrariesInstalled.map.lib(state.localLibraries.document);
  const localLibrariesObserver = new MutationObserver(() => {});
  localLibrariesObserver.observe(localLibrariesRoot, { subtree: true, childList: true, attributes: true, characterData: true });
  const localLibrariesContinuation = continue_document({
    map: localLibrariesInstalled.map,
    document: localLibrariesSelected,
    root: localLibrariesRoot,
  });
  check("local aggregate continuation resolves the selected document name", state.localLibraries.document === "page");
  check("local aggregate continuation preserves root identity", localLibrariesContinuation.tree.dom.el() === localLibrariesRoot);
  check("local aggregate continuation preserves descendant identity", localLibrariesRoot.firstElementChild === localLibrariesButton);
  check("local aggregate continuation writes nothing", localLibrariesObserver.takeRecords().length === 0);
  check("local aggregate install restores the complete snapshot", localLibrariesInstalled.map.lib("state").snap(["count"]) === 7 && localLibrariesInstalled.map.rev === state.localLibraries.bootstrap.revision);
  localLibrariesObserver.disconnect();
  localLibrariesContinuation.dispose();

  const decodedFull = decode_ssr_bootstrap(state.encoded.full);
  const fullMap = install_libraries_snapshot(decodedFull.bootstrap).map;
  const parsedFull = new DOMParser().parseFromString(state.full.html, "text/html");
  check("full document parses in standards mode", parsedFull.compatMode === "CSS1Compat");
  const fullRoot = parsedFull.documentElement;
  check("full-document bootstrap remains out-of-band", parsedFull.querySelector('script[type="application/vnd.hson-live.ssr-bootstrap"]') === null);
  const fullObserver = new MutationObserver(() => {});
  fullObserver.observe(fullRoot, { subtree: true, childList: true, attributes: true, characterData: true });
  const fullContinuation = continue_document({ map: fullMap, document: fullMap.lib(state.full.document), root: fullRoot });
  check("full documentElement identity survives", fullContinuation.tree.dom.el() === fullRoot);
  check("full document out-of-band continuation writes nothing", fullObserver.takeRecords().length === 0);
  fullObserver.disconnect();
  fullContinuation.dispose();

  const librariesRoot = document.querySelector("#libraries-ssr");
  const librariesButton = librariesRoot.firstElementChild;
  const decodedHostedLibraries = decode_ssr_bootstrap(state.encoded.libraries);
  check("browser hosted Libraries encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedHostedLibraries.bootstrap) === state.encoded.libraries);
  check("hosted carrier is the projected v3 family", decodedHostedLibraries.kind === "hosted-projection");
  const librariesMap = hson.liveMap.fromClientSnapshot({ authority: decodedHostedLibraries.bootstrap, localLibraries: {} });
  check("aggregate client map starts at its local revision", librariesMap.rev === 0);
  check("projected authority snapshot carries N", decodedHostedLibraries.bootstrap.revision === state.libraries.bootstrap.revision);
  check("aggregate install restores included Libraries", librariesMap.lib("admin").mode === "document" && librariesMap.lib("state").mode !== "document");
  let hiddenUnavailable = false;
  try { librariesMap.lib("@hson/canonical-interactions/v1"); } catch { hiddenUnavailable = true; }
  check("hidden interaction Library remains unavailable", hiddenUnavailable);
  const librariesSocket = create_browser_locus_socket(state.librariesSocketUrl);
  await librariesSocket.ready;
  const librariesEcho = create_echo({
    socket: librariesSocket.socket,
    map: librariesMap,
    recovery: { logicalMapId: decodedHostedLibraries.bootstrap.authority.logicalMapId },
    session: { credential: state.credential },
  });
  check("Echo cursor starts at projected authority N", librariesEcho.recovery.lastAppliedRev === decodedHostedLibraries.bootstrap.revision && librariesMap.rev === 0);
  librariesEcho.connect();
  await librariesEcho.session.reattach();
  const selected = librariesEcho.map.lib(state.libraries.document);
  let interactionCalls = 0;
  const librariesContinuation = await continue_hosted_document({
    echo: librariesEcho,
    authority: decodedHostedLibraries.bootstrap,
    document: selected,
    root: librariesRoot,
    interactions: { local: { clicker: () => { interactionCalls += 1; } } },
  });
  check("aggregate recovery catches projected N up to N+1", librariesEcho.recovery.status === "caught_up"
    && librariesEcho.recovery.lastAppliedRev === state.libraries.bootstrap.revision + 1 && librariesMap.rev === 1);
  check("selected aggregate DOM converges", librariesRoot.getAttribute("data-recovered") === "page");
  check("other public document converges", librariesEcho.map.lib("admin").at([]).attrs.get("data-recovered") === "admin");
  check("data Library converges", librariesEcho.map.lib("state").snap(["count"]) === 1);
  librariesButton.click();
  for (let attempt = 0; attempt < 50 && librariesEcho.map.lib("state").snap(["count"]) !== 5; attempt += 1) {
    await new Promise((resolve) => setTimeout(resolve, 10));
  }
  check("canonical hidden interactions activate after aggregate continuation", interactionCalls === 1);
  check("canonical authoritative interaction dispatches through Echo", librariesEcho.map.lib("state").snap(["count"]) === 5 && librariesMap.rev === 2);
  const librariesButtonTree = librariesContinuation.tree.find.must.byTag("button");
  const librariesLocalQuid = librariesButtonTree.quid;
  check("aggregate browser identity is acquired locally", typeof librariesLocalQuid === "string" && librariesButton.getAttribute("hson:quid") === librariesLocalQuid);
  await librariesButtonTree.async.attrs.set("data-async", "accepted");
  check("aggregate AsyncLiveTree uses local map revision", librariesButton.getAttribute("data-async") === "accepted" && librariesMap.rev === 3);
  const action = await librariesEcho.action("state.increment");
  check("configured aggregate action remains operational", action.type === "ack" && librariesEcho.map.lib("state").snap(["count"]) === 2 && librariesMap.rev === 4);
  librariesContinuation.dispose();
  librariesEcho.dispose();
  librariesSocket.dispose();

  document.documentElement.dataset.status = "pass";
  document.documentElement.dataset.detail = `${results.length}/${results.length}`;
} catch (cause) {
  document.documentElement.dataset.status = "fail";
  document.documentElement.dataset.detail = `${cause?.stack ?? String(cause)}\nCAUSE: ${cause?.cause?.stack ?? String(cause?.cause ?? "none")}`;
}
</script>
</body>
</html>
