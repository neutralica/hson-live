<!doctype html>
<html>
<head><meta charset="utf-8"><title>Document SSR acceptance</title></head>
<body>
<section id="local-shell"><!--LOCAL_SSR--></section>
<section id="local-libraries-shell"><!--LOCAL_LIBRARIES_SSR--></section>
<section id="libraries-shell"><!--LIBRARIES_SSR--></section>
<div id="result"></div>
<script type="module">
import {
  ANY_DATA,
  ANY_DOCUMENT,
  Hson,
  continue_document,
  continue_hosted_document,
  create_echo,
  create_browser_locus_socket,
  decode_ssr_bootstrap,
  encode_ssr_bootstrap,
  hson,
  hsonLiveMap,
  install_libraries_snapshot,
  render_document,
} from "/bundle.js";

const results = [];
const check = (name, condition) => {
  results.push({ name, pass: Boolean(condition) });
  if (!condition) throw new Error(`Failed: ${name}`);
};

try {
  const emptyMap = hsonLiveMap.create();
  const emptyCapture = emptyMap.capture();
  emptyMap.restore(emptyCapture);
  check("browser empty LiveMap captures and restores", emptyMap.rev === 0 && emptyCapture.libraries.length === 0);
  const primitiveMap = hsonLiveMap.fromLibraries({ value: { data: 7, schema: ANY_DATA } });
  check("browser primitive data root admits and captures", primitiveMap.lib("value").mode === "data-number"
    && primitiveMap.lib("value").snap() === 7 && primitiveMap.capture().libraries.length === 1);
  const broadDocument = Hson.document`<main <p "browser"/>/>`;
  check("browser document family top certifies nested content", ANY_DOCUMENT.certify(broadDocument) === broadDocument);
  const state = await fetch("/__state").then((response) => response.json());
  const decodedLocalBootstrap = decode_ssr_bootstrap(state.encoded.local);
  check("browser local encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedLocalBootstrap.bootstrap) === state.encoded.local);
  const localRoot = document.querySelector("#local-ssr");
  check("application root is delivered in standards mode", document.compatMode === "CSS1Compat");
  const localParagraph = localRoot.firstElementChild;
  const localText = localParagraph.firstChild;
  const localMap = install_libraries_snapshot(decodedLocalBootstrap.bootstrap).map;
  const localPage = localMap.lib(state.local.document);
  const observer = new MutationObserver(() => {});
  observer.observe(localRoot, { subtree: true, childList: true, attributes: true, characterData: true });
  const localContinuation = continue_document({ map: localMap, document: localPage, root: localRoot });
  check("local root identity survives continuation", localContinuation.tree.dom.el() === localRoot);
  check("local element identity survives continuation", localRoot.firstElementChild === localParagraph);
  check("local text identity survives continuation", localParagraph.firstChild === localText);
  check("local continuation writes nothing", observer.takeRecords().length === 0);
  check("local revision is exact N", localMap.rev === state.local.bootstrap.revision && localMap.rev === 1);
  check("local canonical capture has no server QUID", JSON.stringify(localMap.capture()) === JSON.stringify(state.local.bootstrap)
    && !JSON.stringify(localMap.capture()).includes("000005201"));
  check("local subject begins without inherited QUID", localParagraph.getAttribute("hson:quid") === null
    && !JSON.stringify(decodedLocalBootstrap.bootstrap).includes("000005201"));
  check("local root remains QUID-free", localRoot.getAttribute("hson:quid") === null);
  check("local paragraph text was parsed", localParagraph.textContent === "ab");
  observer.disconnect();
  const localParagraphTree = localContinuation.tree.find.must.byTag("p");
  const localQuid = localParagraphTree.quid;
  check("browser identity demand establishes local QUID", typeof localQuid === "string" && localParagraph.getAttribute("hson:quid") === localQuid);
  check("local QUID lookup resolves adopted subject", localContinuation.tree.find.byQuid(localQuid)?.dom.el() === localParagraph);
  localParagraphTree.css.set.color("red");
  const localCss = localParagraphTree.css.snapshot();
  check("local CSS ownership uses browser QUID", localCss.includes(localQuid)
    && /color:\s*red/.test(localCss)
    && !localCss.includes("000005201"));
  localContinuation.dispose();

  const browserLocal = render_document({ map: localMap });
  check("Node and browser-compatible local SSR bytes match", browserLocal.html === state.local.html);
  check("browser local rendering matches its continuation", JSON.stringify(browserLocal.bootstrap) === JSON.stringify(localMap.capture()));

  const localLibrariesRoot = document.querySelector("#local-libraries-ssr");
  const localLibrariesButton = localLibrariesRoot.firstElementChild;
  const decodedLocalLibraries = decode_ssr_bootstrap(state.encoded.localLibraries);
  check("browser Libraries encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedLocalLibraries.bootstrap) === state.encoded.localLibraries);
  const localLibrariesInstalled = install_libraries_snapshot(decodedLocalLibraries.bootstrap);
  const browserLibrariesRender = render_document({ map: localLibrariesInstalled.map });
  check("browser Libraries rendering retains the complete continuation", browserLibrariesRender.document === "page"
    && browserLibrariesRender.html === state.localLibraries.html
    && JSON.stringify(browserLibrariesRender.bootstrap) === JSON.stringify(decodedLocalLibraries.bootstrap));
  const localLibrariesSelected = localLibrariesInstalled.map.lib(state.localLibraries.document);
  const localLibrariesObserver = new MutationObserver(() => {});
  localLibrariesObserver.observe(localLibrariesRoot, { subtree: true, childList: true, attributes: true, characterData: true });
  const localLibrariesContinuation = continue_document({
    map: localLibrariesInstalled.map,
    document: localLibrariesSelected,
    root: localLibrariesRoot,
  });
  check("local aggregate continuation resolves the selected document name", state.localLibraries.document === "page");
  check("local aggregate continuation preserves root identity", localLibrariesContinuation.tree.dom.el() === localLibrariesRoot);
  check("local aggregate continuation preserves descendant identity", localLibrariesRoot.firstElementChild === localLibrariesButton);
  check("local aggregate continuation writes nothing", localLibrariesObserver.takeRecords().length === 0);
  check("local aggregate install restores the complete snapshot", localLibrariesInstalled.map.lib("state").snap(["count"]) === 7 && localLibrariesInstalled.map.rev === state.localLibraries.bootstrap.revision);
  localLibrariesObserver.disconnect();
  localLibrariesContinuation.dispose();

  const decodedFull = decode_ssr_bootstrap(state.encoded.full);
  const fullMap = install_libraries_snapshot(decodedFull.bootstrap).map;
  const parsedFull = new DOMParser().parseFromString(state.full.html, "text/html");
  check("full document parses in standards mode", parsedFull.compatMode === "CSS1Compat");
  const fullRoot = parsedFull.documentElement;
  check("full-document bootstrap remains out-of-band", parsedFull.querySelector('script[type="application/vnd.hson-live.ssr-bootstrap"]') === null);
  const fullObserver = new MutationObserver(() => {});
  fullObserver.observe(fullRoot, { subtree: true, childList: true, attributes: true, characterData: true });
  const fullContinuation = continue_document({ map: fullMap, document: fullMap.lib(state.full.document), root: fullRoot });
  check("full documentElement identity survives", fullContinuation.tree.dom.el() === fullRoot);
  check("full document out-of-band continuation writes nothing", fullObserver.takeRecords().length === 0);
  fullObserver.disconnect();
  fullContinuation.dispose();

  const cssMap = hsonLiveMap.fromLibraries({ page: { document: '<html <head/> <body/>/>' } });
  cssMap.lib("page").css.sel("body").set.margin("0");
  const cssRoot = new DOMParser().parseFromString(cssMap.render("page"), "text/html").documentElement;
  const cssStyle = cssRoot.querySelector('style[data-hson-managed-document-css="v1"]');
  const cssBefore = cssStyle.textContent;
  const cssObserver = new MutationObserver(() => {});
  cssObserver.observe(cssRoot, { subtree: true, childList: true, characterData: true, attributes: true });
  const cssContinuation = continue_document({ map: cssMap, document: cssMap.lib("page"), root: cssRoot });
  check("CSS continuation adopts existing managed style without a write", cssStyle === cssRoot.querySelector('style[data-hson-managed-document-css="v1"]')
    && cssStyle.textContent === cssBefore && cssObserver.takeRecords().length === 0);
  cssObserver.disconnect();
  const cssBeforeGlobalRev = cssMap.rev;
  const boundGlobalCss = cssContinuation.tree.css.global;
  await Promise.resolve();
  check("bound global reads create no competing runtime style host", cssRoot.querySelector("hson-_style#css-manager") === null);
  check("bound global access does not acquire root QUID identity", cssMap.rev === cssBeforeGlobalRev
    && cssRoot.getAttribute("hson:quid") === null);
  const cssRev = cssMap.rev;
  boundGlobalCss.sel("body").set.padding("2px");
  check("bound LiveTree global writes one semantic map transition", cssMap.rev === cssRev + 1
    && cssMap.lib("page").css.get("sel:body")?.includes("padding:2px"));
  check("bound LiveTree snapshot includes document CSS", cssContinuation.tree.css.snapshot().includes("padding:2px"));
  const cssRemoveRev = cssMap.rev;
  boundGlobalCss.sel("body").remove("padding");
  check("bound rule removal is one semantic map transition", cssMap.rev === cssRemoveRev + 1
    && !cssMap.lib("page").css.get("sel:body")?.includes("padding"));
  cssMap.lib("page").css.stylesheet("body { color: blue; }");
  check("page CSS updates adopted style and bound reads", cssStyle === cssRoot.querySelector('style[data-hson-managed-document-css="v1"]')
    && cssStyle.textContent === cssMap.lib("page").css.snapshot()
    && cssContinuation.tree.css.global.list().includes("stylesheet:1"));
  const ingressRev = cssMap.rev;
  cssContinuation.tree.css.global.stylesheet("body { background: yellow; }");
  check("bound stylesheet ingress updates document semantic state", cssMap.lib("page").css.list().includes("stylesheet:2")
    && cssStyle.textContent === cssMap.lib("page").css.snapshot() && cssMap.rev === ingressRev + 1);
  const cssCapture = cssMap.capture();
  cssMap.lib("page").css.atProperty.register(["--phase", "<number>", "0"]);
  cssMap.lib("page").css.keyframes.set({ name: "phase", steps: { from: { opacity: "0" }, to: { opacity: "1" } } });
  cssContinuation.tree.css.global.media({ minWidth: 1 }).sel("body").set.margin("3px");
  check("bound registries and scoped rules follow document state", cssStyle.textContent === cssMap.lib("page").css.snapshot()
    && cssContinuation.tree.css.global.atProperty.has("--phase")
    && cssContinuation.tree.css.global.keyframes.has("phase"));
  cssMap.restore(cssCapture);
  check("restore converges the same managed style", cssStyle === cssRoot.querySelector('style[data-hson-managed-document-css="v1"]')
    && cssStyle.textContent === cssMap.lib("page").css.snapshot()
    && !cssContinuation.tree.css.global.keyframes.has("phase"));
  cssMap.lib("page").css.clearAll();
  check("clearAll removes empty managed realization", cssRoot.querySelector('style[data-hson-managed-document-css]') === null
    && cssContinuation.tree.css.global.list().length === 0);
  cssMap.lib("page").css.sel("body").set.margin("1px");
  check("CSS added after an empty state creates one managed realization", cssRoot.querySelectorAll('style[data-hson-managed-document-css="v1"]').length === 1
    && cssRoot.querySelector('style[data-hson-managed-document-css]').textContent === cssMap.lib("page").css.snapshot());
  cssContinuation.dispose();
  const reboundLocalStyle = cssRoot.querySelector('style[data-hson-managed-document-css]');
  const reboundLocal = continue_document({ map: cssMap, root: cssRoot });
  check("bound CSS recontinuation reuses the tree and managed element", reboundLocal.tree === cssContinuation.tree
    && cssRoot.querySelector('style[data-hson-managed-document-css]') === reboundLocalStyle);
  reboundLocal.dispose();

  const reboundMap = hsonLiveMap.fromLibraries({ page: { document: '<html <head/> <body/>/>' } });
  reboundMap.lib("page").css.sel("body").set.margin("0");
  const reboundRoot = new DOMParser().parseFromString(reboundMap.render("page"), "text/html").documentElement;
  const reboundStyle = reboundRoot.querySelector('style[data-hson-managed-document-css]');
  const firstBinding = continue_document({ map: reboundMap, root: reboundRoot });
  firstBinding.dispose();
  const secondBinding = continue_document({ map: reboundMap, root: reboundRoot });
  check("CSS recontinuation reuses exact managed style", secondBinding.tree === firstBinding.tree
    && reboundRoot.querySelector('style[data-hson-managed-document-css]') === reboundStyle);
  secondBinding.dispose();

  const malformedMap = hsonLiveMap.fromLibraries({ page: { document: '<html <head/> <body/>/>' } });
  malformedMap.lib("page").css.sel("body").set.color("red");
  const malformedHtml = malformedMap.render("page");
  const rejectCss = (name, mutate) => {
    const root = new DOMParser().parseFromString(malformedHtml, "text/html").documentElement;
    mutate(root);
    let failure;
    try { continue_document({ map: malformedMap, root }); } catch (cause) { failure = cause; }
    check(name, failure?.phase === "adopt" && failure.cause instanceof Error);
  };
  rejectCss("missing managed style fails adoption", (root) => root.querySelector('style[data-hson-managed-document-css]').remove());
  rejectCss("duplicate managed style fails adoption", (root) => root.querySelector("head").appendChild(root.querySelector('style[data-hson-managed-document-css]').cloneNode(true)));
  rejectCss("wrong marker fails adoption", (root) => root.querySelector("style").setAttribute("data-hson-managed-document-css", "v2"));
  rejectCss("wrong style location fails adoption", (root) => root.querySelector("body").appendChild(root.querySelector("style")));
  rejectCss("wrong CSS text fails adoption", (root) => { root.querySelector("style").textContent = "body{color:blue;}"; });
  rejectCss("extra forged managed style fails adoption", (root) => {
    const forged = root.ownerDocument.createElement("style");
    forged.setAttribute("data-hson-managed-document-css", "v1");
    root.querySelector("body").appendChild(forged);
  });
  const emptyCssMap = hsonLiveMap.fromLibraries({ page: { document: '<html <head/> <body/>/>' } });
  const staleRoot = new DOMParser().parseFromString(emptyCssMap.render("page"), "text/html").documentElement;
  const stale = staleRoot.ownerDocument.createElement("style");
  stale.setAttribute("data-hson-managed-document-css", "v1");
  staleRoot.querySelector("head").appendChild(stale);
  let staleFailure;
  try { continue_document({ map: emptyCssMap, root: staleRoot }); } catch (cause) { staleFailure = cause; }
  check("managed style with empty semantic CSS fails adoption", staleFailure?.phase === "adopt");

  const emptyStartRoot = new DOMParser().parseFromString(emptyCssMap.render("page"), "text/html").documentElement;
  const emptyStartContinuation = continue_document({ map: emptyCssMap, root: emptyStartRoot });
  emptyCssMap.lib("page").css.sel("body").set.color("green");
  check("first post-continuation CSS commit creates managed style", emptyStartRoot.querySelectorAll('style[data-hson-managed-document-css="v1"]').length === 1
    && emptyStartRoot.querySelector("style").textContent === emptyCssMap.lib("page").css.snapshot());
  emptyStartContinuation.dispose();

  const styledLibraries = hsonLiveMap.fromLibraries({
    alpha: { document: '<html <head <style "body{color:red;}"/>/> <body <p "A"/>/>/>' },
    beta: { document: '<html <head/> <body <p "B"/>/>/>' },
  });
  styledLibraries.lib("alpha").css.sel("body").set.color("blue");
  styledLibraries.lib("beta").css.sel("body").set.color("green");
  const alphaRoot = new DOMParser().parseFromString(styledLibraries.render("alpha"), "text/html").documentElement;
  const betaRoot = new DOMParser().parseFromString(styledLibraries.render("beta"), "text/html").documentElement;
  const authoredStyle = alphaRoot.querySelector("head style:not([data-hson-managed-document-css])");
  const alphaManaged = alphaRoot.querySelector('style[data-hson-managed-document-css]');
  const betaManaged = betaRoot.querySelector('style[data-hson-managed-document-css]');
  const alphaContinued = continue_document({ map: styledLibraries, document: styledLibraries.lib("alpha"), root: alphaRoot });
  const betaContinued = continue_document({ map: styledLibraries, document: styledLibraries.lib("beta"), root: betaRoot });
  check("authored style remains graph content alongside managed CSS", authoredStyle === alphaRoot.querySelector("head style:not([data-hson-managed-document-css])")
    && alphaContinued.tree.find.byTag("style")?.dom.el() === authoredStyle);
  styledLibraries.lib("alpha").css.sel("body").set.margin("4px");
  check("two selected Libraries retain separate managed style ownership", alphaManaged.textContent === styledLibraries.lib("alpha").css.snapshot()
    && betaManaged.textContent === styledLibraries.lib("beta").css.snapshot()
    && alphaContinued.tree.css.global.get("sel:body") !== betaContinued.tree.css.global.get("sel:body"));
  const staleAlphaCss = alphaContinued.tree.css.global;
  alphaContinued.dispose();
  betaContinued.dispose();
  check("disposal retains semantic CSS and caller DOM", alphaManaged.isConnected && betaManaged.isConnected
    && styledLibraries.lib("alpha").css.has("sel:body"));
  const detachedCssText = alphaManaged.textContent;
  styledLibraries.lib("alpha").css.sel("body").set.padding("8px");
  let staleBoundWriteFailed = false;
  try { staleAlphaCss.sel("body").set.padding("9px"); } catch (cause) { staleBoundWriteFailed = /disposed/.test(cause.message); }
  check("disposal stops browser CSS observation and stale bound writes", alphaManaged.textContent === detachedCssText
    && staleBoundWriteFailed && styledLibraries.lib("alpha").css.get("sel:body")?.includes("padding:8px"));

  const replaySource = hsonLiveMap.fromLibraries({ page: { document: '<html <head/> <body/>/>' } });
  replaySource.lib("page").css.sel("body").set.margin("0");
  const replayTarget = hsonLiveMap.fromLibraries({ page: { document: '<html <head/> <body/>/>' } });
  replayTarget.lib("page").css.sel("body").set.margin("0");
  const replayRoot = new DOMParser().parseFromString(replayTarget.render("page"), "text/html").documentElement;
  const replayStyle = replayRoot.querySelector('style[data-hson-managed-document-css]');
  const replayContinued = continue_document({ map: replayTarget, root: replayRoot });
  let cssCommit;
  const stopReplaySource = replaySource.commits.observe((commit) => { cssCommit = commit; });
  replaySource.lib("page").css.sel("body").set.padding("6px");
  stopReplaySource();
  replayTarget.replay(cssCommit);
  check("CSS replay converges existing bound realization", replayStyle === replayRoot.querySelector('style[data-hson-managed-document-css]')
    && replayStyle.textContent === replayTarget.lib("page").css.snapshot());
  replayContinued.dispose();

  const cascadeMap = hsonLiveMap.fromLibraries({ page: { document: '<html <head/> <body <p id=target "Target"/>/>/>' } });
  cascadeMap.lib("page").css.sel("p").set.color("blue");
  const cascadeFrame = document.createElement("iframe");
  cascadeFrame.srcdoc = cascadeMap.render("page");
  const cascadeLoaded = new Promise((resolve) => cascadeFrame.addEventListener("load", resolve, { once: true }));
  document.body.appendChild(cascadeFrame);
  await cascadeLoaded;
  const cascadeDocument = cascadeFrame.contentDocument;
  const cascadeRoot = cascadeDocument.documentElement;
  const cascadeManaged = cascadeRoot.querySelector('style[data-hson-managed-document-css]');
  const cascadeContinued = continue_document({ map: cascadeMap, root: cascadeRoot });
  const target = cascadeRoot.querySelector("#target");
  const targetTree = cascadeContinued.tree.find.must.byTag("p");
  check("SSR document CSS computes before runtime QUID CSS", cascadeFrame.contentWindow.getComputedStyle(target).color === "rgb(0, 0, 255)");
  const releasedQuid = targetTree.quid;
  targetTree.css.set.color("red");
  await new Promise((resolve) => cascadeFrame.contentWindow.requestAnimationFrame(() => cascadeFrame.contentWindow.requestAnimationFrame(resolve)));
  const runtimeStyle = cascadeRoot.querySelector("hson-_style#css-manager style#_hson");
  check("QUID CSS uses later separate runtime host and wins cascade", runtimeStyle !== null
    && cascadeManaged.compareDocumentPosition(runtimeStyle) & Node.DOCUMENT_POSITION_FOLLOWING
    && cascadeFrame.contentWindow.getComputedStyle(target).color === "rgb(255, 0, 0)");
  check("bound snapshot composes document and runtime CSS", targetTree.css.snapshot().includes("p{color:blue;}")
    && targetTree.css.snapshot().includes(targetTree.quid));
  targetTree.css.clear();
  await new Promise((resolve) => cascadeFrame.contentWindow.requestAnimationFrame(() => cascadeFrame.contentWindow.requestAnimationFrame(resolve)));
  check("QUID CSS removal preserves document CSS", cascadeManaged.textContent === cascadeMap.lib("page").css.snapshot()
    && cascadeFrame.contentWindow.getComputedStyle(target).color === "rgb(0, 0, 255)");
  targetTree.css.set.color("red");
  cascadeMap.lib("page").css.clearAll();
  cascadeMap.lib("page").css.sel("p").set.color("blue");
  await new Promise((resolve) => cascadeFrame.contentWindow.requestAnimationFrame(() => cascadeFrame.contentWindow.requestAnimationFrame(resolve)));
  const renewedManaged = cascadeRoot.querySelector('style[data-hson-managed-document-css]');
  check("managed style reappears before active runtime QUID host", renewedManaged !== null
    && (renewedManaged.compareDocumentPosition(runtimeStyle) & Node.DOCUMENT_POSITION_FOLLOWING) !== 0
    && cascadeFrame.contentWindow.getComputedStyle(target).color === "rgb(255, 0, 0)");
  cascadeMap.lib("page").document.content.remove({ kind: "path", path: [0, 0, 1] }, 0);
  await new Promise((resolve) => cascadeFrame.contentWindow.requestAnimationFrame(() => cascadeFrame.contentWindow.requestAnimationFrame(resolve)));
  check("releasing a QUID node retains document CSS", cascadeRoot.querySelector("#target") === null
    && renewedManaged.textContent === cascadeMap.lib("page").css.snapshot()
    && !cascadeContinued.tree.css.snapshot().includes(releasedQuid));
  cascadeContinued.dispose();
  cascadeFrame.remove();

  const librariesRoot = document.querySelector("#libraries-ssr");
  const librariesButton = librariesRoot.firstElementChild;
  const decodedHostedLibraries = decode_ssr_bootstrap(state.encoded.libraries);
  check("browser hosted Libraries encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedHostedLibraries.bootstrap) === state.encoded.libraries);
  check("hosted carrier is the projected v3 family", decodedHostedLibraries.kind === "hosted-projection");
  const librariesMap = hson.liveMap.fromClientSnapshot({ authority: decodedHostedLibraries.bootstrap, localLibraries: {} });
  check("aggregate client map starts at its local revision", librariesMap.rev === 0);
  check("projected authority snapshot carries N", decodedHostedLibraries.bootstrap.revision === state.libraries.bootstrap.revision);
  check("aggregate install restores included Libraries", librariesMap.lib("admin").mode === "document" && librariesMap.lib("state").mode !== "document");
  let hiddenUnavailable = false;
  try { librariesMap.lib("@hson/canonical-interactions/v1"); } catch { hiddenUnavailable = true; }
  check("hidden interaction Library remains unavailable", hiddenUnavailable);
  const librariesSocket = create_browser_locus_socket(state.librariesSocketUrl);
  await librariesSocket.ready;
  const librariesEcho = create_echo({
    socket: librariesSocket.socket,
    map: librariesMap,
    recovery: { logicalMapId: decodedHostedLibraries.bootstrap.authority.logicalMapId },
    session: { credential: state.credential },
  });
  check("Echo cursor starts at projected authority N", librariesEcho.recovery.lastAppliedRev === decodedHostedLibraries.bootstrap.revision && librariesMap.rev === 0);
  librariesEcho.connect();
  await librariesEcho.session.reattach();
  const selected = librariesEcho.map.lib(state.libraries.document);
  let interactionCalls = 0;
  const librariesContinuation = await continue_hosted_document({
    echo: librariesEcho,
    authority: decodedHostedLibraries.bootstrap,
    document: selected,
    root: librariesRoot,
    interactions: { local: { clicker: () => { interactionCalls += 1; } } },
  });
  check("aggregate recovery catches projected N up to N+1", librariesEcho.recovery.status === "caught_up"
    && librariesEcho.recovery.lastAppliedRev === state.libraries.bootstrap.revision + 1 && librariesMap.rev === 1);
  check("selected aggregate DOM converges", librariesRoot.getAttribute("data-recovered") === "page");
  check("other public document converges", librariesEcho.map.lib("admin").at([]).attrs.get("data-recovered") === "admin");
  check("data Library converges", librariesEcho.map.lib("state").snap(["count"]) === 1);
  librariesButton.click();
  for (let attempt = 0; attempt < 50 && librariesEcho.map.lib("state").snap(["count"]) !== 5; attempt += 1) {
    await new Promise((resolve) => setTimeout(resolve, 10));
  }
  check("canonical hidden interactions activate after aggregate continuation", interactionCalls === 1);
  check("canonical authoritative interaction dispatches through Echo", librariesEcho.map.lib("state").snap(["count"]) === 5 && librariesMap.rev === 2);
  const librariesButtonTree = librariesContinuation.tree.find.must.byTag("button");
  const librariesLocalQuid = librariesButtonTree.quid;
  check("aggregate browser identity is acquired locally", typeof librariesLocalQuid === "string" && librariesButton.getAttribute("hson:quid") === librariesLocalQuid);
  await librariesButtonTree.async.attrs.set("data-async", "accepted");
  check("aggregate AsyncLiveTree uses local map revision", librariesButton.getAttribute("data-async") === "accepted" && librariesMap.rev === 3);
  const action = await librariesEcho.action("state.increment");
  check("configured aggregate action remains operational", action.type === "ack" && librariesEcho.map.lib("state").snap(["count"]) === 2 && librariesMap.rev === 4);
  const hostedGlobalCss = librariesContinuation.tree.css.global;
  const hostedCssRev = librariesMap.rev;
  let hostedCssWriteFailed = false;
  try { hostedGlobalCss.sel("body").set.margin("0"); }
  catch (cause) { hostedCssWriteFailed = /Hosted document CSS authoring/.test(cause.message); }
  check("hosted bound global CSS writes are fenced pending Phase C", hostedCssWriteFailed
    && librariesMap.rev === hostedCssRev && hostedGlobalCss.list().length === 0);
  librariesContinuation.dispose();
  librariesEcho.dispose();
  librariesSocket.dispose();

  document.documentElement.dataset.status = "pass";
  document.documentElement.dataset.detail = `${results.length}/${results.length}`;
} catch (cause) {
  document.documentElement.dataset.status = "fail";
  document.documentElement.dataset.detail = `${cause?.stack ?? String(cause)}\nCAUSE: ${cause?.cause?.stack ?? String(cause?.cause ?? "none")}`;
}
</script>
</body>
</html>
