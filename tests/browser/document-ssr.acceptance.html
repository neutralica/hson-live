<!doctype html>
<html>
<head><meta charset="utf-8"><title>Document SSR acceptance</title></head>
<body>
<section id="local-shell"><!--LOCAL_SSR--></section>
<section id="local-libraries-shell"><!--LOCAL_LIBRARIES_SSR--></section>
<section id="hosted-shell"><!--HOSTED_SSR--><!--HOSTED_CARRIER--></section>
<section id="libraries-shell"><!--LIBRARIES_SSR--></section>
<div id="result"></div>
<script type="module">
import {
  continue_document,
  continue_hosted_document,
  create_echo,
  create_browser_locus_socket,
  decode_ssr_bootstrap,
  encode_ssr_bootstrap,
  hson,
  install_libraries_snapshot,
  install_locus_snapshot,
  install_locus_libraries_snapshot,
  render_document,
} from "/bundle.js";

const results = [];
const check = (name, condition) => {
  results.push({ name, pass: Boolean(condition) });
  if (!condition) throw new Error(`Failed: ${name}`);
};

try {
  const state = await fetch("/__state").then((response) => response.json());
  const decodedLocalBootstrap = decode_ssr_bootstrap(state.encoded.local);
  check("browser local encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedLocalBootstrap.bootstrap) === state.encoded.local);
  const decodedLargeBootstrap = decode_ssr_bootstrap(state.encoded.largeHosted);
  check("browser larger encoding matches Node byte-for-byte", encode_ssr_bootstrap(state.largeHostedBootstrap) === state.encoded.largeHosted);
  check("browser larger canonical decode is exact", decodedLargeBootstrap.kind === "hosted-document" && decodedLargeBootstrap.bootstrap.hson === state.largeHostedBootstrap.hson);

  const localRoot = document.querySelector("#local-ssr");
  check("application root is delivered in standards mode", document.compatMode === "CSS1Compat");
  const localParagraph = localRoot.firstElementChild;
  const localText = localParagraph.firstChild;
  const localMap = hson.liveMap.fromNode(decodedLocalBootstrap.bootstrap.root);
  if (localMap.mode !== "document") throw new Error("local SSR bootstrap must be a document");
  localMap.restore(decodedLocalBootstrap.bootstrap, { identity: "preserve-metadata" });
  const observer = new MutationObserver(() => {});
  observer.observe(localRoot, { subtree: true, childList: true, attributes: true, characterData: true });
  const localContinuation = continue_document({ map: localMap, root: localRoot });
  check("local root identity survives continuation", localContinuation.tree.dom.el() === localRoot);
  check("local element identity survives continuation", localRoot.firstElementChild === localParagraph);
  check("local text identity survives continuation", localParagraph.firstChild === localText);
  check("local continuation writes nothing", observer.takeRecords().length === 0);
  check("local revision is exact N", localMap.rev === state.local.bootstrap.rev && localMap.rev === 1);
  check("local canonical capture is exact", JSON.stringify(localMap.capture()) === JSON.stringify(state.local.bootstrap));
  check("local QUID is exact", localParagraph.getAttribute("hson:quid") === "000005201");
  check("local root remains QUID-free", localRoot.getAttribute("hson:quid") === null);
  check("Hson boundary comments were parsed", [...localParagraph.childNodes].filter((node) => node.nodeType === Node.COMMENT_NODE).length >= 2);
  observer.disconnect();
  localContinuation.dispose();

  const browserLocal = render_document({ map: localMap });
  check("Node and browser-compatible local SSR bytes match", browserLocal.html === state.local.html);
  const browserLocalCut = localMap.cut();
  check("browser local object cut matches its continuation", browserLocalCut.html === browserLocal.html
    && JSON.stringify(browserLocalCut.data) === JSON.stringify(browserLocal.bootstrap));

  const localLibrariesRoot = document.querySelector("#local-libraries-ssr");
  const localLibrariesButton = localLibrariesRoot.firstElementChild;
  const decodedLocalLibraries = decode_ssr_bootstrap(state.encoded.localLibraries);
  check("browser Libraries encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedLocalLibraries.bootstrap) === state.encoded.localLibraries);
  const localLibrariesInstalled = install_libraries_snapshot(decodedLocalLibraries.bootstrap);
  const browserLibrariesCut = localLibrariesInstalled.map.cut();
  check("browser Libraries object cut retains the complete continuation", browserLibrariesCut.document === "page"
    && browserLibrariesCut.html === state.localLibraries.html
    && JSON.stringify(browserLibrariesCut.data) === JSON.stringify(decodedLocalLibraries.bootstrap));
  const localLibrariesSelected = localLibrariesInstalled.map.lib(state.localLibraries.document);
  const localLibrariesObserver = new MutationObserver(() => {});
  localLibrariesObserver.observe(localLibrariesRoot, { subtree: true, childList: true, attributes: true, characterData: true });
  const localLibrariesContinuation = continue_document({
    map: localLibrariesInstalled.map,
    document: localLibrariesSelected,
    root: localLibrariesRoot,
  });
  check("local aggregate continuation resolves the selected document name", state.localLibraries.document === "page");
  check("local aggregate continuation preserves root identity", localLibrariesContinuation.tree.dom.el() === localLibrariesRoot);
  check("local aggregate continuation preserves descendant identity", localLibrariesRoot.firstElementChild === localLibrariesButton);
  check("local aggregate continuation writes nothing", localLibrariesObserver.takeRecords().length === 0);
  check("local aggregate install restores the complete cut", localLibrariesInstalled.map.lib("state").snap(["count"]) === 7 && localLibrariesInstalled.map.rev === state.localLibraries.bootstrap.revision);
  localLibrariesObserver.disconnect();
  localLibrariesContinuation.dispose();

  const decodedFull = decode_ssr_bootstrap(state.encoded.full);
  const fullMap = hson.liveMap.fromNode(decodedFull.bootstrap.root);
  if (fullMap.mode !== "document") throw new Error("full SSR bootstrap must be a document");
  fullMap.restore(decodedFull.bootstrap, { identity: "preserve-metadata" });
  const parsedFull = new DOMParser().parseFromString(state.full.html, "text/html");
  check("full document parses in standards mode", parsedFull.compatMode === "CSS1Compat");
  const fullRoot = parsedFull.documentElement;
  check("full-document bootstrap remains out-of-band", parsedFull.querySelector('script[type="application/vnd.hson-live.ssr-bootstrap"]') === null);
  const fullObserver = new MutationObserver(() => {});
  fullObserver.observe(fullRoot, { subtree: true, childList: true, attributes: true, characterData: true });
  const fullContinuation = continue_document({ map: fullMap, root: fullRoot });
  check("full documentElement identity survives", fullContinuation.tree.dom.el() === fullRoot);
  check("full document out-of-band continuation writes nothing", fullObserver.takeRecords().length === 0);
  fullObserver.disconnect();
  fullContinuation.dispose();

  const hostedRoot = document.querySelector("#hosted-ssr");
  const carriers = document.querySelectorAll('#hosted-shell > script[type="application/vnd.hson-live.ssr-bootstrap"]');
  check("application-root shell has exactly one inert carrier sibling", carriers.length === 1 && carriers[0].previousElementSibling === hostedRoot);
  check("carrier text is exact encoded bootstrap", carriers[0].textContent === state.encoded.hosted);
  check("encoded carrier cannot contain parser-adversarial semantic text", !carriers[0].textContent.includes("<") && !carriers[0].textContent.includes(">") && !carriers[0].textContent.includes("&"));
  const decodedHosted = decode_ssr_bootstrap(carriers[0].textContent);
  check("browser hosted encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedHosted.bootstrap) === state.encoded.hosted);
  const hostedParagraph = hostedRoot.firstElementChild;
  const hostedText = hostedParagraph.firstChild;
  const installed = install_locus_snapshot(decodedHosted.bootstrap);
  check("hosted snapshot starts at N", installed.map.rev === state.hosted.bootstrap.rev && installed.map.rev === 0);
  const browserSocket = create_browser_locus_socket(state.socketUrl);
  await browserSocket.ready;
  const echo = create_echo({
    socket: browserSocket.socket,
    map: installed.map,
    recovery: installed.recovery,
    session: {},
  });
  echo.connect();
  await echo.session.create();
  const hostedContinuation = await continue_hosted_document({ echo, root: hostedRoot });
  check("hosted continuation reuses the installed client map", hostedContinuation.map === installed.map);
  check("hosted recovery catches N up to N+1", echo.recovery.status === "caught_up" && installed.map.rev === 1);
  check("hosted root identity survives recovery", hostedContinuation.tree.dom.el() === hostedRoot);
  check("hosted element identity survives recovery", hostedRoot.firstElementChild === hostedParagraph);
  check("hosted text identity survives recovery", hostedParagraph.firstChild === hostedText);
  check("hosted N+1 mutation is reflected", hostedParagraph.getAttribute("data-recovered") === "yes");
  await hostedContinuation.tree.find.must.byQuid("000005202").async.attrs.set("data-async", "accepted");
  check("AsyncLiveTree mutates after SSR continuation", hostedParagraph.getAttribute("data-async") === "accepted" && installed.map.rev === 2);
  hostedContinuation.dispose();
  echo.dispose();
  browserSocket.dispose();

  const librariesRoot = document.querySelector("#libraries-ssr");
  const librariesButton = librariesRoot.firstElementChild;
  const decodedHostedLibraries = decode_ssr_bootstrap(state.encoded.libraries);
  check("browser hosted Libraries encoding matches Node byte-for-byte", encode_ssr_bootstrap(decodedHostedLibraries.bootstrap) === state.encoded.libraries);
  const librariesInstalled = install_locus_libraries_snapshot(decodedHostedLibraries.bootstrap);
  check("aggregate install restores exact global revision N", librariesInstalled.map.rev === state.libraries.bootstrap.revision);
  check("aggregate install restores every public Library", librariesInstalled.map.lib("admin").mode === "document" && librariesInstalled.map.lib("state").mode !== "document");
  let hiddenUnavailable = false;
  try { librariesInstalled.map.lib("@hson/canonical-interactions/v1"); } catch { hiddenUnavailable = true; }
  check("hidden interaction Library remains unavailable", hiddenUnavailable);
  const librariesSocket = create_browser_locus_socket(state.librariesSocketUrl);
  await librariesSocket.ready;
  const librariesEcho = create_echo({
    socket: librariesSocket.socket,
    map: librariesInstalled.map,
    recovery: librariesInstalled.recovery,
    session: {},
  });
  librariesEcho.connect();
  await librariesEcho.session.create();
  const selected = librariesEcho.map.lib(state.libraries.document);
  let interactionCalls = 0;
  const librariesContinuation = await continue_hosted_document({
    echo: librariesEcho,
    document: selected,
    root: librariesRoot,
    interactions: { local: { clicker: () => { interactionCalls += 1; } } },
  });
  check("aggregate recovery catches complete N up to N+1", librariesEcho.recovery.status === "caught_up" && librariesInstalled.map.rev === state.libraries.bootstrap.revision + 1);
  check("selected aggregate DOM converges", librariesRoot.getAttribute("data-recovered") === "page");
  check("other public document converges", librariesEcho.map.lib("admin").at([]).attrs.get("data-recovered") === "admin");
  check("data Library converges", librariesEcho.map.lib("state").snap(["count"]) === 1);
  librariesButton.click();
  for (let attempt = 0; attempt < 50 && librariesEcho.map.lib("state").snap(["count"]) !== 5; attempt += 1) {
    await new Promise((resolve) => setTimeout(resolve, 10));
  }
  check("canonical hidden interactions activate after aggregate continuation", interactionCalls === 1);
  check("canonical authoritative interaction dispatches through Echo", librariesEcho.map.lib("state").snap(["count"]) === 5 && librariesInstalled.map.rev === state.libraries.bootstrap.revision + 2);
  await librariesContinuation.tree.find.must.byQuid("000005203").async.attrs.set("data-async", "accepted");
  check("aggregate AsyncLiveTree uses the global revision", librariesButton.getAttribute("data-async") === "accepted" && librariesInstalled.map.rev === state.libraries.bootstrap.revision + 3);
  const action = await librariesEcho.action("state.increment");
  check("configured aggregate action remains operational", action.type === "ack" && librariesEcho.map.lib("state").snap(["count"]) === 2 && librariesInstalled.map.rev === state.libraries.bootstrap.revision + 4);
  librariesContinuation.dispose();
  librariesEcho.dispose();
  librariesSocket.dispose();

  document.documentElement.dataset.status = "pass";
  document.documentElement.dataset.detail = `${results.length}/${results.length}`;
} catch (cause) {
  document.documentElement.dataset.status = "fail";
  document.documentElement.dataset.detail = `${cause?.stack ?? String(cause)}\nCAUSE: ${cause?.cause?.stack ?? String(cause?.cause ?? "none")}`;
}
</script>
</body>
</html>
